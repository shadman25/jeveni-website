<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeveni Admin</title>
<meta name="robots" content="noindex,nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--purple:#57228a;--pink:#ed2879;--ink:#17213b;--muted:#667085;--bg:#f7f5fb;--white:#fff;--border:#e7e3ed;--danger:#c62828;--success:#177245}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--border);border-radius:24px;padding:34px;box-shadow:0 18px 60px rgba(30,20,60,.10)}
.brand{text-align:center;font-size:32px;font-weight:900;color:var(--purple)}.brand span{color:var(--pink)}.subtitle{text-align:center;color:var(--muted);margin:6px 0 28px}
label{display:block;font-weight:700;font-size:14px;margin:16px 0 7px}input,textarea,select{width:100%;padding:12px 13px;border:1px solid #d8d3df;border-radius:12px;outline:none;background:#fff;color:var(--ink)}textarea{min-height:95px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(237,40,121,.10)}
.btn{border:0;border-radius:12px;padding:11px 16px;color:#fff;font-weight:800;background:linear-gradient(90deg,var(--purple),var(--pink))}.btn.full{width:100%;margin-top:22px}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--border)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #efcaca}.btn:disabled{opacity:.55;cursor:not-allowed}
.notice,.message{margin-top:16px;padding:11px 13px;border-radius:12px;background:#faf7ff;color:var(--muted);font-size:13px;line-height:1.5}.message.error{background:#fff2f2;color:var(--danger)}.message.success{background:#f0faf4;color:var(--success)}
.admin-shell{min-height:100vh}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.topbar .brand{font-size:25px}.top-actions{display:flex;align-items:center;gap:12px}.user-email{font-size:13px;color:var(--muted)}.logout{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 14px}
.content{max-width:1180px;margin:0 auto;padding:35px 24px}.header-row{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.header-row h1{margin:0;font-size:32px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:28px}.card,.panel{background:#fff;border:1px solid var(--border);border-radius:18px}.card{padding:22px}.card small{color:var(--muted);display:block}.card strong{font-size:30px}.panel{padding:24px}.panel h2{margin-top:0}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #d8d3df;border-radius:14px}
.product-list{display:grid;gap:12px}.product-row{display:grid;grid-template-columns:72px 1fr auto;gap:15px;align-items:center;border:1px solid var(--border);border-radius:14px;padding:12px}.thumb{width:72px;height:72px;border-radius:12px;background:#f8f0f7;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.product-name{font-weight:800}.meta{font-size:13px;color:var(--muted);margin-top:4px}.row-actions{display:flex;gap:8px}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.status.active{background:#edf8f1;color:var(--success)}.status.inactive{background:#f3f3f3;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(18,13,28,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{width:min(700px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:26px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:15px}.modal-head h2{margin:0}.close{border:0;background:#f4f1f6;border-radius:10px;width:38px;height:38px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.full-col{grid-column:1/-1}.image-help{font-size:12px;color:var(--muted);margin-top:7px}.preview{margin-top:12px;width:130px;height:130px;border-radius:14px;overflow:hidden;background:#f8f0f7;display:none}.preview img{width:100%;height:100%;object-fit:contain}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.check{display:flex;align-items:center;gap:8px;margin-top:18px;font-weight:700}.check input{width:auto}.loading{text-align:center;color:var(--muted);padding:20px}
@media(max-width:700px){.cards{grid-template-columns:1fr}.topbar{padding:0 16px}.content{padding:25px 16px}.form-grid{grid-template-columns:1fr}.full-col{grid-column:auto}.user-email{display:none}.product-row{grid-template-columns:58px 1fr}.thumb{width:58px;height:58px}.row-actions{grid-column:2;justify-content:flex-start;flex-wrap:wrap}}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="brand">Je<span>veni</span></div>
    <div class="subtitle">Admin Panel</div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="admin@example.com" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button class="btn full" id="loginBtn" type="submit">Login</button>
      <div id="loginMessage" class="message" style="display:none"></div>
    </form>
    <div class="notice">Only approved JEVENI admin accounts can access product management.</div>
  </div>
</div>

<div id="dashboard" class="admin-shell" style="display:none">
  <header class="topbar">
    <div class="brand">Je<span>veni</span> Admin</div>
    <div class="top-actions"><span id="userEmail" class="user-email"></span><button class="logout" id="logoutBtn">Logout</button></div>
  </header>
  <main class="content">
    <div class="header-row">
      <div><h1>Dashboard</h1><div style="color:#667085;margin-top:5px">Manage Jeveni products and website content.</div></div>
      <button class="btn" id="addProductBtn" type="button">+ Add Product</button>
    </div>
    <div class="cards">
      <div class="card"><small>Total Products</small><strong id="totalCount">0</strong></div>
      <div class="card"><small>Active Products</small><strong id="activeCount">0</strong></div>
      <div class="card"><small>Categories</small><strong id="categoryCount">0</strong></div>
    </div>
    <section class="panel">
      <h2>Products</h2>
      <div id="productList" class="product-list"><div class="loading">Loading products...</div></div>
    </section>
  </main>
</div>

<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle">Add Product</h2><button class="close" id="closeModalBtn" type="button">×</button></div>
    <form id="productForm">
      <div class="form-grid">
        <div><label for="productName">Product Name *</label><input id="productName" required maxlength="150"></div>
        <div><label for="productCategory">Category *</label><input id="productCategory" placeholder="Feminine Care" required maxlength="80"></div>
        <div class="full-col"><label for="productDescription">Description</label><textarea id="productDescription" maxlength="1000"></textarea></div>
        <div><label for="productSize">Size / Variant</label><input id="productSize" placeholder="XL 280mm"></div>
        <div><label for="productPack">Pack Size</label><input id="productPack" placeholder="8 pads"></div>
        <div class="full-col"><label for="productUsage">Usage Information</label><textarea id="productUsage" maxlength="1000"></textarea></div>
        <div><label for="productOrder">Display Order</label><input id="productOrder" type="number" value="0" min="0"></div>
        <div class="check"><input id="productActive" type="checkbox" checked><label for="productActive" style="margin:0">Active product</label></div>
        <div class="full-col"><label for="productImage">Product Image <span id="imageRequired">*</span></label><input id="productImage" type="file" accept="image/jpeg,image/webp"><div class="image-help">JPG/JPEG or WebP only. Maximum 499 KB.</div><div id="imagePreview" class="preview"><img id="previewImg" alt="Preview"></div></div>
      </div>
      <div id="formMessage" class="message" style="display:none"></div>
      <div class="form-actions"><button class="btn secondary" id="cancelBtn" type="button">Cancel</button><button class="btn" id="saveBtn" type="submit">Save Product</button></div>
    </form>
  </div>
</div>

<script>
const JEVENI_SUPABASE_URL = "https://athuczqpkpgqdmqyvlww.supabase.co";
const JEVENI_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_BWuILR9iUVcHPUx9Gt1VVg_vWfkKi-C";
const isConfigured = JEVENI_SUPABASE_URL.startsWith("https://") && !JEVENI_SUPABASE_URL.includes("YOUR_") && !JEVENI_SUPABASE_PUBLISHABLE_KEY.includes("YOUR_");
const { createClient } = window.supabase;
const supabaseClient = isConfigured ? createClient(JEVENI_SUPABASE_URL, JEVENI_SUPABASE_PUBLISHABLE_KEY) : null;

const loginScreen=document.getElementById("loginScreen"),dashboard=document.getElementById("dashboard"),loginMessage=document.getElementById("loginMessage");
const productList=document.getElementById("productList"),modalBackdrop=document.getElementById("modalBackdrop"),productForm=document.getElementById("productForm");
let editingProduct=null, products=[];

function showMessage(el,text,type="error"){el.textContent=text;el.className=`message ${type}`;el.style.display="block";}
function hideMessage(el){el.style.display="none";el.textContent="";}
function escapeHtml(value){return String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
function ensureConfigured(){if(!supabaseClient){showMessage(loginMessage,"Supabase is not configured in this admin page yet. Add your Project URL and publishable key first.");return false}return true;}

async function isCurrentUserAdmin(userId){
  const {data,error}=await supabaseClient.from("admin_users").select("user_id,email").eq("user_id",userId).maybeSingle();
  if(error) throw error;
  return data;
}

async function showDashboard(user){
  const admin=await isCurrentUserAdmin(user.id);
  if(!admin){await supabaseClient.auth.signOut();showMessage(loginMessage,"This account is authenticated but is not registered as a JEVENI admin.");return;}
  document.getElementById("userEmail").textContent=admin.email||user.email||"";
  loginScreen.style.display="none";dashboard.style.display="block";await loadProducts();
}

async function loadProducts(){
  productList.innerHTML='<div class="loading">Loading products...</div>';
  const {data,error}=await supabaseClient.from("products").select("id,name,category,description,size_variant,pack_size,usage,image_url,is_active,display_order,created_at,updated_at").order("display_order",{ascending:true}).order("created_at",{ascending:false});
  if(error){productList.innerHTML="";showMessage(productList,error.message);return}
  products=data||[];renderProducts();
}

function renderProducts(){
  const active=products.filter(p=>p.is_active).length;
  const categories=new Set(products.map(p=>(p.category||"").trim().toLowerCase()).filter(Boolean));
  document.getElementById("totalCount").textContent=products.length;
  document.getElementById("activeCount").textContent=active;
  document.getElementById("categoryCount").textContent=categories.size;
  if(!products.length){productList.innerHTML='<div class="empty">No products yet. Click “+ Add Product” to create the first one.</div>';return;}
  productList.innerHTML=products.map(p=>{
    const thumb=p.image_url?`<img src="${escapeHtml(p.image_url)}" alt="">`:`<span style="font-size:28px">🌸</span>`;
    return `<div class="product-row"><div class="thumb">${thumb}</div><div><div class="product-name">${escapeHtml(p.name)}</div><div class="meta">${escapeHtml(p.category||"JEVENI")} ${p.size_variant?"• "+escapeHtml(p.size_variant):""} ${p.pack_size?"• "+escapeHtml(p.pack_size):""}</div><span class="status ${p.is_active?"active":"inactive"}">${p.is_active?"Active":"Inactive"}</span></div><div class="row-actions"><button class="btn secondary edit-btn" data-id="${p.id}">Edit</button><button class="btn danger delete-btn" data-id="${p.id}">Delete</button></div></div>`;
  }).join("");
  document.querySelectorAll(".edit-btn").forEach(b=>b.addEventListener("click",()=>openEdit(b.dataset.id)));
  document.querySelectorAll(".delete-btn").forEach(b=>b.addEventListener("click",()=>deleteProduct(b.dataset.id)));
}

function openAdd(){editingProduct=null;productForm.reset();document.getElementById("productActive").checked=true;document.getElementById("productOrder").value=0;document.getElementById("modalTitle").textContent="Add Product";document.getElementById("imageRequired").style.display="inline";document.getElementById("imagePreview").style.display="none";hideMessage(document.getElementById("formMessage"));modalBackdrop.style.display="flex";}
function openEdit(id){const p=products.find(x=>x.id===id);if(!p)return;editingProduct=p;document.getElementById("modalTitle").textContent="Edit Product";document.getElementById("productName").value=p.name||"";document.getElementById("productCategory").value=p.category||"";document.getElementById("productDescription").value=p.description||"";document.getElementById("productSize").value=p.size_variant||"";document.getElementById("productPack").value=p.pack_size||"";document.getElementById("productUsage").value=p.usage||"";document.getElementById("productOrder").value=p.display_order??0;document.getElementById("productActive").checked=!!p.is_active;document.getElementById("productImage").value="";document.getElementById("imageRequired").style.display="none";hideMessage(document.getElementById("formMessage"));if(p.image_url){document.getElementById("previewImg").src=p.image_url;document.getElementById("imagePreview").style.display="block"}else document.getElementById("imagePreview").style.display="none";modalBackdrop.style.display="flex";}
function closeModal(){modalBackdrop.style.display="none";editingProduct=null;productForm.reset();}

function validateImage(file){
  if(!file)return {ok:true};
  const allowed=["image/jpeg","image/webp"];
  if(!allowed.includes(file.type))return {ok:false,message:"Only JPG/JPEG and WebP images are allowed."};
  if(file.size>=500*1024)return {ok:false,message:"Image must be less than 500 KB."};
  return {ok:true};
}

async function uploadImage(file){
  const ext=file.type==="image/webp"?"webp":"jpg";
  const path=`products/${crypto.randomUUID()}.${ext}`;
  const {error}=await supabaseClient.storage.from("product-images").upload(path,file,{contentType:file.type,upsert:false});
  if(error)throw error;
  const {data}=supabaseClient.storage.from("product-images").getPublicUrl(path);
  return data.publicUrl;
}

function storagePathFromPublicUrl(url){
  const marker="/storage/v1/object/public/product-images/";const i=(url||"").indexOf(marker);return i>=0?decodeURIComponent(url.slice(i+marker.length)):null;
}

async function deleteStoredImage(url){const path=storagePathFromPublicUrl(url);if(!path)return;await supabaseClient.storage.from("product-images").remove([path]);}

productForm.addEventListener("submit",async e=>{
  e.preventDefault();if(!ensureConfigured())return;
  const msg=document.getElementById("formMessage"),save=document.getElementById("saveBtn");hideMessage(msg);
  const file=document.getElementById("productImage").files[0];const validation=validateImage(file);if(!validation.ok){showMessage(msg,validation.message);return;}
  save.disabled=true;save.textContent="Saving...";
  try{
    const payload={name:document.getElementById("productName").value.trim(),category:document.getElementById("productCategory").value.trim(),description:document.getElementById("productDescription").value.trim()||null,size_variant:document.getElementById("productSize").value.trim()||null,pack_size:document.getElementById("productPack").value.trim()||null,usage:document.getElementById("productUsage").value.trim()||null,is_active:document.getElementById("productActive").checked,display_order:Number(document.getElementById("productOrder").value)||0};
    let imageUrl=editingProduct?.image_url||null;
    if(file)imageUrl=await uploadImage(file);
    payload.image_url=imageUrl;
    let error;
    if(editingProduct){({error}=await supabaseClient.from("products").update(payload).eq("id",editingProduct.id));}
    else ({error}=await supabaseClient.from("products").insert(payload));
    if(error)throw error;
    if(file&&editingProduct?.image_url&&editingProduct.image_url!==imageUrl)await deleteStoredImage(editingProduct.image_url);
    closeModal();await loadProducts();
  }catch(err){console.error(err);showMessage(msg,err.message||"Unable to save product.");}
  finally{save.disabled=false;save.textContent="Save Product";}
});

async function deleteProduct(id){
  if(!confirm("Delete this product? This cannot be undone."))return;
  const p=products.find(x=>x.id===id);if(!p)return;
  try{const {error}=await supabaseClient.from("products").delete().eq("id",id);if(error)throw error;if(p.image_url)await deleteStoredImage(p.image_url);await loadProducts();}
  catch(err){alert(err.message||"Unable to delete product.");}
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();if(!ensureConfigured())return;hideMessage(loginMessage);const btn=document.getElementById("loginBtn");btn.disabled=true;btn.textContent="Signing in...";
  try{const {data,error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});if(error)throw error;if(data.user)await showDashboard(data.user);}
  catch(err){showMessage(loginMessage,err.message||"Login failed.");}
  finally{btn.disabled=false;btn.textContent="Login";}
});

document.getElementById("logoutBtn").addEventListener("click",async()=>{if(supabaseClient)await supabaseClient.auth.signOut();dashboard.style.display="none";loginScreen.style.display="grid";document.getElementById("password").value="";});
document.getElementById("addProductBtn").addEventListener("click",openAdd);document.getElementById("closeModalBtn").addEventListener("click",closeModal);document.getElementById("cancelBtn").addEventListener("click",closeModal);modalBackdrop.addEventListener("click",e=>{if(e.target===modalBackdrop)closeModal();});
document.getElementById("productImage").addEventListener("change",e=>{const f=e.target.files[0],msg=document.getElementById("formMessage");hideMessage(msg);const v=validateImage(f);if(!v.ok){showMessage(msg,v.message);e.target.value="";document.getElementById("imagePreview").style.display="none";return;}if(f){document.getElementById("previewImg").src=URL.createObjectURL(f);document.getElementById("imagePreview").style.display="block";}});

async function init(){
  if(!supabaseClient){return;}
  const {data}=await supabaseClient.auth.getSession();if(data.session?.user){try{await showDashboard(data.session.user)}catch(err){console.error(err);await supabaseClient.auth.signOut();showMessage(loginMessage,"Unable to verify admin access.");}}
}
init();
</script>
</body>
</html>
